services:
  pdfscanner:
    build: .
    env_file:
      - .env
    environment:
      - FLAGS_use_mkldnn=0
    volumes:
      # Mount your documents folder
      - ./data:/app/data
      # Mount output folder to get results
      - ./output:/app/output
    # Default: extract mode. Override with: docker compose run pdfscanner <file> --mode full
    command: ["data/samples"]
