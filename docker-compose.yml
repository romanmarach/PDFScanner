services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  pdfscanner:
    build: .
    env_file:
      - .env
    environment:
      - FLAGS_use_mkldnn=0
    volumes:
      # Mount your documents folder
      - ./data:/app/data
      # Mount output folder to get results
      - ./output:/app/output
    # Default: extract mode. Override with: docker compose run pdfscanner <file> --mode full
    command: ["data/samples"]

volumes:
  redis-data:
