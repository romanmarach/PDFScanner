name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # paddlepaddle/paddleocr are intentionally skipped: the unit test suite
      # stubs paddleocr in tests/conftest.py, so CI avoids the heavy OCR install.
      # Integration tests (--run-integration) are local-only.
      - name: Install dependencies
        run: grep -Ev '^(paddle(paddle|ocr)|#|$)' requirements.txt | xargs python -m pip install

      - name: Run tests
        run: python -m pytest tests/ -v
